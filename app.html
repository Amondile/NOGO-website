<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOGO – Map</title>
<script>document.documentElement.style.visibility="hidden"</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section id="view-map" class="view active">
    <div id="map"></div>
    <div class="topbar">
      <input id="search" type="search" placeholder="Search assets" autocomplete="off">
      <div id="results" class="results" hidden></div>
    </div>
    <button id="locate" class="fab" aria-label="My location">◎</button>
    <div id="card" class="card" hidden></div>
  </section>
  <section id="view-assets" class="view"><h1>Assets</h1><div id="list"></div></section>
  <section id="view-add" class="view">
    <h1>Add asset</h1>
    <div class="form">
      <details class="sec" open><summary>Required</summary>
        <label>Name<input id="f-name" placeholder="e.g. John's iPhone"></label>
        <label>Asset type<select id="f-type"></select></label>
        <label>Identifier<input id="f-device" placeholder="e.g. 358240051111110"></label>
        <p class="hint">IMEI, serial number or other ID. It has to match the identifier the device reports to the server.</p>
      </details>
      <details class="sec"><summary>Extra</summary>
        <label>Model<input id="f-model" placeholder="Optional"></label>
        <label>Phone number<input id="f-phone" inputmode="tel" placeholder="Optional"></label>
        <label>Contact<input id="f-contact" placeholder="Optional"></label>
      </details>
      <p id="f-err" class="err"></p>
      <button id="f-submit" class="btn primary">Add Asset</button>
    </div>
  </section>
  <section id="view-account" class="view"><h1>Account</h1><div id="account"></div></section>
</main>
<nav id="nav">
  <button data-tab="map" class="on"><i>⌖</i>Map</button>
  <button data-tab="assets"><i>☰</i>Assets</button>
  <button data-tab="add"><i>＋</i>Add</button>
  <button data-tab="account"><i>◯</i>Account</button>
</nav>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/traccar.js"></script>
<script src="js/backend.js"></script>
<script>NOGO.auth.getSession().then(function(u){if(!u)location.replace("index.html");else document.documentElement.style.visibility=""})</script>
<script src="js/models.js"></script>
<script src="js/mock-data.js"></script>
<script src="js/api.js"></script>
<script src="js/backend.js"></script>
<script src="js/config.js"></script>
<script src="js/map.js"></script>
<script src="js/app.js"></script>
</body>
</html>
